name: Create Jennifer Production Builds

# Run from expo.dev → jennifer → Workflows. The iOS build goes straight to TestFlight.
jobs:
  build_android:
    name: Build Jennifer Android
    type: build
    params:
      platform: android
      profile: production
  build_ios:
    name: Build Jennifer iOS
    type: build
    params:
      platform: ios
      profile: production
  submit_ios:
    name: Send to TestFlight
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
