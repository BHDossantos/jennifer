# Local development stack. Separate databases per environment (spec §3).
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: jennifer
      POSTGRES_PASSWORD: jennifer-dev-only
      POSTGRES_DB: jennifer_dev
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jennifer -d jennifer_dev"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
