# Weekly grouped dependency updates: one PR per ecosystem per week instead of
# a pile of single-package PRs. Security updates still arrive on their own.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # hoodiecrow-imap 3 answers X-GM-THRID itself, so the fake test inbox no
      # longer behaves like the Gmail threading the tests assert. Test-only
      # dependency; lift once test/integration/gmail.test.ts is adapted.
      - dependency-name: "hoodiecrow-imap"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: "/mobile"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-mobile-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      docker-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions-minor-patch:
        update-types: ["minor", "patch"]
