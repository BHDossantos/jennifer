# One-click hosting on Render (no Google Cloud project): HTTPS web service + managed Postgres.
# Dashboard → New → Blueprint → select this repo. Then set OPENAI_API_KEY.
services:
  - type: web
    name: jennifer
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: false            # deploy deliberately; migrations run on boot
    envVars:
      - key: JENNIFER_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: jennifer-db
          property: connectionString
      - key: JENNIFER_API_TOKEN      # bootstrap token: used once to register your passkey
        generateValue: true
      - key: JENNIFER_WEBHOOK_SECRET
        generateValue: true
      - key: JENNIFER_VAULT_KEYS     # vault master secret (encrypts the Gmail app password)
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false                  # paste in the Render dashboard
      - key: ANTHROPIC_API_KEY       # optional: Claude as Jennifer's brain (console.anthropic.com → API keys)
        sync: false
      - key: MODEL_PROVIDER          # auto | openai | anthropic (auto = OpenAI when its key is set)
        value: auto
      - key: JENNIFER_EMAIL_SANDBOX  # optional: only these recipients until you remove it
        sync: false
      - key: OPENAI_WEBHOOK_SECRET   # phone calls: from OpenAI dashboard → Webhooks (realtime.call.incoming)
        sync: false
      - key: TWILIO_ACCOUNT_SID      # optional SMS on Jennifer's number (Twilio, or SignalWire project id)
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: JENNIFER_SMS_FROM       # Jennifer's number, E.164
        sync: false
      - key: TWILIO_API_BASE         # SignalWire only: https://<space>.signalwire.com/api/laml
        sync: false
      - key: JENNIFER_ALERT_SMS_TO   # your mobile, for urgent alerts when push is off
        sync: false
      - key: GOOGLE_CLIENT_ID          # Google Calendar read/write (OAuth client from your Google Cloud project)
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: WHATSAPP_TOKEN            # Meta system-user token (WhatsApp Cloud API)
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
      - key: JENNIFER_WHATSAPP_SPACE   # personal | insurance | music | restaurant | nonprofit | technology
        value: personal
      - key: JENNIFER_IMESSAGE_URL      # BlueBubbles Server on your Mac (Cloudflare URL)
        sync: false
      - key: JENNIFER_IMESSAGE_PASSWORD
        sync: false
      - key: JENNIFER_IMESSAGE_WEBHOOK_TOKEN
        generateValue: true
      - key: JENNIFER_TRANSFER_NUMBER  # your own number (E.164) for warm transfers; leave empty to disable
        sync: false

databases:
  - name: jennifer-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"
